<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>envpod dashboard</title>
    <link rel="stylesheet" href="/style.css">
    <script src="/htmx.min.js"></script>
</head>
<body>
<div class="container">
    <header>
        <h1>envpod <span class="version">dashboard</span></h1>
    </header>

    <div id="pod-list"></div>
</div>


<script>
const TOKEN = window.ENVPOD_TOKEN || '';

function authHeaders(extra) {
    return Object.assign({ 'Authorization': 'Bearer ' + TOKEN }, extra || {});
}

// Load pods on start + poll
loadPods();
setInterval(loadPods, 10000);

function loadPods() {
    fetch('/api/v1/pods', { headers: authHeaders() })
        .then(r => r.json())
        .then(pods => {
            const el = document.getElementById('pod-list');
            if (!pods || pods.length === 0) {
                el.innerHTML = '<div class="empty"><h3>No pods found</h3><p>Create a pod with: envpod init my-agent</p></div>';
            } else {
                el.innerHTML = '<div class="pod-grid">' + pods.map(renderPodCard).join('') + '</div>';
            }
        })
        .catch(() => {});
}

function renderPodCard(pod) {
    const statusClass = pod.status || 'stopped';
    const mem = pod.resources ? formatBytes(pod.resources.memory_bytes) : '-';
    const pids = pod.resources ? pod.resources.pids_current : '-';
    const diffBadge = pod.diff_count > 0
        ? `<span class="badge yellow">${pod.diff_count} changes</span>`
        : '';

    return `
        <a href="/pod.html?name=${encodeURIComponent(pod.name)}" class="pod-card">
            <div class="name">
                <span class="status ${statusClass}"></span>
                ${escapeHtml(pod.name)}
            </div>
            <div class="meta">
                <span class="item">${statusClass}</span>
                <span class="item">mem: ${mem}</span>
                <span class="item">pids: ${pids}</span>
            </div>
            <div style="margin-top:8px; display:flex; gap:6px;">
                ${diffBadge}
            </div>
        </a>`;
}



function formatBytes(bytes) {
    if (!bytes || bytes === 0) return '0 B';
    const units = ['B', 'KB', 'MB', 'GB'];
    let i = 0;
    let val = bytes;
    while (val >= 1024 && i < units.length - 1) { val /= 1024; i++; }
    return val.toFixed(i > 0 ? 1 : 0) + ' ' + units[i];
}

function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
}
</script>
</body>
</html>
